# Checks the skill on every pull request, and on every push to main: the same format
# check Spacesheep runs when it takes a release, and the scripts' tests.
name: Check the skill

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npx -y spacesheep@latest skills lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: pip install numpy pyyaml pillow pytest

      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - run: pytest -q tests
