<!doctype html>
<html><head><meta charset="utf-8"><title>Explorer module demo</title>
<style>html,body{margin:0;height:100%;background:#060906;overflow:hidden}</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script></head>
<body>
<script type="module">
// A host page: its own renderer, scene, camera and loop, with the explorer mounted as one object (see explorer-module.js).
import * as THREE from "three";
import { createExplorer } from "./explorer-module.js";
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(innerWidth, innerHeight); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color("#060906");
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 5000);
const ex = createExplorer({ scene, camera, base: "./", theme: "dark", height: 100 });
await ex.load();
ex.setPalette({ base: "#2f6f4a" });
const q = new URLSearchParams(location.search);
// ?glow=Embeddings,12 layers&dim=Output&lift=Output: group names from your own groups file
const list = (k) => (q.get(k) || "").split(",").map((x) => x.trim()).filter(Boolean);
for (const g of list("glow")) ex.highlight(g, "#6cff8f", 1);
if (list("dim").length) ex.dim(list("dim"), 0.9);
if (list("lift").length) ex.lift(list("lift"), 0.5);
camera.position.set(70, 30, 170); camera.lookAt(0, 0, 0);
function frame(t) { ex.root.rotation.y = Math.sin(t / 3000) * 0.35; renderer.render(scene, camera); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
window.__demo = { ex, THREE, scene, camera };
</script></body></html>
