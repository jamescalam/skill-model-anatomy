<!doctype html><html><head><meta charset="utf-8"><title>module: fog and boost</title>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script></head><body style="margin:0;background:#060906">
<script type="module">
import * as THREE from "three"; import { createExplorer } from "./explorer-module.js";
const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: false }); renderer.setSize(600, 400); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color("#060906");
if (q.has("fog")) scene.fog = new THREE.FogExp2("#060906", 0.012);
const camera = new THREE.PerspectiveCamera(40, 1.5, 0.1, 2000); camera.position.set(40, 30, 150); camera.lookAt(0, 0, -20);
const ex = createExplorer({ scene, camera, base: "./" });
ex.setPalette({ base: "#2f6f4a" }).highlight("Encoder", "#6cff8f", 1, Number(q.get("boost") || 1));
await ex.load();
renderer.render(scene, camera);
// the brightest red/green/blue the encoder shows, read from a float target (what a bloom pass would see)
const rt = new THREE.WebGLRenderTarget(600, 400, { type: THREE.FloatType }); renderer.setRenderTarget(rt); renderer.render(scene, camera);
const buf = new Float32Array(600 * 400 * 4); renderer.readRenderTargetPixels(rt, 0, 0, 600, 400, buf); renderer.setRenderTarget(null);
let max = 0, farGreen = 0, nearGreen = 0; for (let i = 0; i < buf.length; i += 4) max = Math.max(max, buf[i + 1]);
window.__fog = { maxGreen: +max.toFixed(2), fog: !!scene.fog };
</script></body></html>
