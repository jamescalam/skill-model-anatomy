<!doctype html><html><head><meta charset="utf-8"><title>module: calls before load</title>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script></head><body style="margin:0;background:#060906">
<script type="module">
import * as THREE from "three"; import { createExplorer } from "./explorer-module.js";
const renderer = new THREE.WebGLRenderer(); renderer.setSize(600, 400); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(40, 1.5, 0.1, 2000); camera.position.set(0, 20, 190); camera.lookAt(0, 0, 0);
const ex = createExplorer({ scene, camera, base: "./" });
ex.setPalette({ base: "#2f6f4a" }).highlight("Encoder", "#6cff8f", 1).dim(["Span head", "Count head"], 0.9);   // BEFORE load()
await ex.load();
renderer.render(scene, camera);
window.__early = { ex, renderer }; window.__camera = camera;
</script></body></html>
